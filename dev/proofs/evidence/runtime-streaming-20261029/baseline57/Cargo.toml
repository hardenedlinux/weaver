[workspace]
resolver = "2"
members = ["crates/weaver-contracts", "crates/weaver-policy", "crates/weaver-ledger", "crates/weaver-broker", "crates/weaver-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
weaver-contracts = { path = "crates/weaver-contracts" }
weaver-policy = { path = "crates/weaver-policy" }
weaver-ledger = { path = "crates/weaver-ledger" }
weaver-broker = { path = "crates/weaver-broker" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
cedar-policy = { version = "=4.12.0", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
proptest = "1.11"
tempfile = "3.27"

asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "1ca41124b846dec947f3d05119cafa07eaa57924", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

