name: Reusable verification suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      label:
        required: true
        type: string
      runner:
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      WEAVER_VERIFY_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dev/proofs/evidence/
            !/dev/specs/evidence/
      - name: Prepare deterministic toolchain
        uses: ./.github/actions/prepare-toolchain
      - name: Fetch locked Rust and Go dependencies
        run: go -C go run ./cmd/weaver-dev -clean-source bootstrap-build
      - name: Prepare Cedar and Lean proof dependencies
        if: inputs.suite == 'check-policy'
        run: go -C go run ./cmd/weaver-dev -clean-source bootstrap-proofs
      - name: Prepare published Scheme SDK
        if: inputs.suite == 'check-scheme'
        uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@838af1ab4e6c0c8177fed176efba448c694012b5
        with:
          release-root: ${{ runner.temp }}/gerbil-sdk
      - name: Install declared Scheme dependencies
        if: inputs.suite == 'check-scheme'
        env:
          GERBIL_PATH: ${{ runner.temp }}/weaver-gerbil
        run: gerbil deps --install
      - name: Verify declared suite
        if: inputs.suite != 'check-scheme'
        run: go -C go run ./cmd/weaver-dev -clean-source "$WEAVER_VERIFY_SUITE"
      - name: Verify Scheme modules, Cedar FFI and streaming recovery
        if: inputs.suite == 'check-scheme'
        env:
          GERBIL_GXI: ${{ env.GERBIL_PREFIX }}/bin/gxi
          GERBIL_PATH: ${{ runner.temp }}/weaver-gerbil
        run: go -C go run ./cmd/weaver-dev -clean-source check-scheme
      - name: Publish latest structured result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .cache/verification/latest-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
