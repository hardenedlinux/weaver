name: Reusable verification suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      label:
        required: true
        type: string
      runner:
        default: ubuntu-24.04
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      WEAVER_VERIFY_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out committed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dev/proofs/evidence/
            !/dev/specs/evidence/
      - name: Prepare deterministic toolchain
        uses: ./.github/actions/prepare-toolchain
      - name: Fetch locked Rust and Go dependencies
        run: go -C go run ./cmd/weaver-dev -clean-source bootstrap-build
      - name: Prepare Cedar and Lean proof dependencies
        if: inputs.suite == 'check-policy'
        run: go -C go run ./cmd/weaver-dev -clean-source bootstrap-proofs
      - name: Prepare published Scheme SDK
        if: inputs.suite == 'check-scheme'
        uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@80e68254092589bbb778c9761a058da16fb6f72e
        with:
          release-root: ${{ runner.temp }}/gerbil-sdk
      - name: Check out Agentic AI Lab dependency closure
        if: inputs.suite == 'check-scheme'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tao3k/agentic-ai-lab
          ref: 921e75f830a60c2ec42c384139846b05ba5d3317
          submodules: recursive
          persist-credentials: false
          path: .data/agentic-ai-lab
      - name: Read the inherited POO revision
        id: poo-dependency
        if: inputs.suite == 'check-scheme'
        run: go -C go run ./cmd/weaver-dev -scheme-source .data/agentic-ai-lab scheme-poo-revision
      - name: Check out the inherited POO dependency
        if: inputs.suite == 'check-scheme'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tao3k/gerbil-poo
          ref: ${{ steps.poo-dependency.outputs.revision }}
          persist-credentials: false
          path: .data/gerbil-poo
      - name: Verify declared suite
        if: inputs.suite != 'check-scheme'
        run: go -C go run ./cmd/weaver-dev -clean-source "$WEAVER_VERIFY_SUITE"
      - name: Verify Scheme modules, Cedar FFI and streaming recovery
        if: inputs.suite == 'check-scheme'
        env:
          WEAVER_CONTROL_SCHEME_COMPILER: ${{ env.GERBIL_PREFIX }}/bin/gxi
        run: go -C go run ./cmd/weaver-dev -clean-source -scheme-source .data/agentic-ai-lab -scheme-poo .data/gerbil-poo check-scheme
      - name: Publish latest structured result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .cache/verification/latest-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
