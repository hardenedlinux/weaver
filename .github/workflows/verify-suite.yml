name: Reusable verification suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      label:
        required: true
        type: string
      runner:
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    # Full dependency preparation has no phase cutoff. Reserve room for the
    # unchanged 37-minute Scheme suite and receipt upload after preparation.
    timeout-minutes: ${{ inputs.suite == 'check-scheme' && 120 || 65 }}
    env:
      GOTOOLCHAIN: local
      WEAVER_VERIFY_SUITE: ${{ inputs.suite }}
      # Gerbil std/make defaults to serial compilation without this setting.
      GERBIL_BUILD_CORES: '4'
    steps:
      - name: Check out committed source
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/dev/proofs/evidence/
            !/dev/specs/evidence/
      - name: Verify tested revision
        id: source
        timeout-minutes: 1
        run: |
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$GITHUB_SHA"
          printf 'revision=%s\n' "$checkout_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare deterministic toolchain
        id: toolchain
        timeout-minutes: 10
        uses: ./.github/actions/prepare-toolchain
      - name: Fetch locked Rust and Go dependencies
        id: bootstrap_build
        timeout-minutes: 4
        run: go -C go run ./cmd/weaver-dev -clean-source -timeout 3m bootstrap-build
      - name: Prepare Cedar and Lean proof dependencies
        id: bootstrap_proofs
        if: inputs.suite == 'check-policy'
        timeout-minutes: 8
        run: go -C go run ./cmd/weaver-dev -clean-source -timeout 7m bootstrap-proofs
      - name: Prepare published Scheme SDK
        id: scheme_sdk
        if: contains(fromJSON('["check-rust", "check-go", "check-policy", "check-scheme", "bench"]'), inputs.suite)
        timeout-minutes: 5
        uses: tao3k/gerbil-scheme-rust/.github/actions/setup-gerbil@56f0d82c061b3d459a0ea15002249654e01853b5
        with:
          release-root: ${{ runner.temp }}/gerbil-sdk
      - name: Prepare macOS Scheme build watchdog
        id: scheme_watchdog
        if: inputs.suite == 'check-scheme' && runner.os == 'macOS'
        timeout-minutes: 4
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install declared Scheme dependencies
        id: scheme_dependencies
        if: inputs.suite == 'check-scheme'
        # Observe complete cold preparation under the whole-job watchdog.
        env:
          # Fix the dependency worker budget before the package manager starts.
          GERBIL_BUILD_CORES: '4'
          GERBIL_PATH: ${{ runner.temp }}/weaver-gerbil
          # Native gambuild-C contract, also used by Parser's compiler profile.
          # Preserve tail calls and the release's optimization level.
          CORCXXFLAGS_GAMBUILD: '-pipe -foptimize-sibling-calls -Wp,-U___SINGLE_HOST,-D___MULTIPLE_HOSTS -ftrack-macro-expansion=0'
          GAMBUILD_VERBOSE: '1'
        run: |
          printf 'build_cores=%s\n' "$GERBIL_BUILD_CORES" >> "$GITHUB_OUTPUT"
          export GAMBOPT="${GAMBOPT:+$GAMBOPT,}debug=q5"
          dependency_started=$SECONDS
          dependency_exit_code=0
          /usr/bin/time -p gerbil -:1n,2n deps --install || dependency_exit_code=$?
          printf 'exit_code=%s\nelapsed_seconds=%s\n' "$dependency_exit_code" "$((SECONDS - dependency_started))" >> "$GITHUB_OUTPUT"
          exit "$dependency_exit_code"
      - name: Verify declared suite
        id: verify_suite
        if: inputs.suite != 'check-scheme'
        timeout-minutes: 30
        run: go -C go run ./cmd/weaver-dev -clean-source -timeout 28m "$WEAVER_VERIFY_SUITE"
      - name: Verify Scheme modules, Cedar FFI and streaming recovery
        id: verify_scheme
        if: inputs.suite == 'check-scheme'
        # The source-closure watchdog is separate. Give the suite room for
        # its prelude and all three independently bounded native stages.
        timeout-minutes: 37
        env:
          GERBIL_GXI: ${{ env.GERBIL_PREFIX }}/bin/gxi
          GERBIL_PATH: ${{ runner.temp }}/weaver-gerbil
        run: go -C go run ./cmd/weaver-dev -clean-source -timeout 35m check-scheme
      - name: Diagnose failed native Scheme owner without rebuilding
        id: scheme_native_diagnostic
        if: failure() && inputs.suite == 'check-scheme' && runner.os == 'Linux' && steps.verify_scheme.conclusion == 'failure'
        timeout-minutes: 4
        env:
          GERBIL_GXI: ${{ env.GERBIL_PREFIX }}/bin/gxi
          GERBIL_PATH: ${{ runner.temp }}/weaver-gerbil
          GOCACHE: ${{ github.workspace }}/.cache/go-build-cache
          GOMODCACHE: ${{ github.workspace }}/.cache/go-mod-cache
        run: |
          if ! jq -e 'any(.stages[]; .name == "scheme-rooted-sdk-integration" and .status == "FAIL")' .cache/verification/latest-check-scheme.json > /dev/null; then
            exit 0
          fi
          owners=()
          for candidate in target/debug/deps/governance_owner-*; do
            if [[ -f "$candidate" && -x "$candidate" ]]; then owners+=("$candidate"); fi
          done
          test "${#owners[@]}" -eq 1
          gdb --batch --return-child-result -x .github/actions/prepare-toolchain/native-owner.gdb --args "${owners[0]}" --exact actual_scheme_vm_is_owner_local_and_cleanup_precedes_shared_drain --nocapture --test-threads=4
      - name: Require successful phase receipts
        id: receipt_check
        timeout-minutes: 1
        run: |
          test -s .cache/verification/latest-bootstrap-build.json
          test -s ".cache/verification/latest-$WEAVER_VERIFY_SUITE.json"
          if [ "$WEAVER_VERIFY_SUITE" = check-policy ]; then
            test -s .cache/verification/latest-bootstrap-proofs.json
          fi
      - name: Write verification job receipt
        if: always()
        timeout-minutes: 1
        env:
          JOB_RECEIPT: >-
            {
              "schema": "weaver.ci-job.v1",
              "suite": ${{ toJSON(inputs.suite) }},
              "runId": ${{ toJSON(github.run_id) }},
              "runAttempt": ${{ toJSON(github.run_attempt) }},
              "headRevision": ${{ toJSON(github.event.pull_request.head.sha || github.sha) }},
              "expectedCheckoutRevision": ${{ toJSON(github.sha) }},
              "checkoutRevision": ${{ toJSON(steps.source.outputs.revision || null) }},
              "os": ${{ toJSON(runner.os) }},
              "arch": ${{ toJSON(runner.arch) }},
              "status": ${{ toJSON(job.status) }},
              "schemeDependencyBudgetMinutes": null,
              "schemeDependencyBuildCores": ${{ steps.scheme_dependencies.outputs.build_cores || 'null' }},
              "schemeDependencyElapsedSeconds": ${{ steps.scheme_dependencies.outputs.elapsed_seconds || 'null' }},
              "schemeDependencyExitCode": ${{ steps.scheme_dependencies.outputs.exit_code || 'null' }},
              "phases": {
                "checkout": ${{ toJSON(steps.checkout.outcome || 'skipped') }},
                "source": ${{ toJSON(steps.source.outcome || 'skipped') }},
                "toolchain": ${{ toJSON(steps.toolchain.outcome || 'skipped') }},
                "bootstrapBuild": ${{ toJSON(steps.bootstrap_build.outcome || 'skipped') }},
                "bootstrapProofs": ${{ toJSON(steps.bootstrap_proofs.outcome || 'skipped') }},
                "schemeSdk": ${{ toJSON(steps.scheme_sdk.outcome || 'skipped') }},
                "schemeWatchdog": ${{ toJSON(steps.scheme_watchdog.outcome || 'skipped') }},
                "schemeDependencies": ${{ toJSON(steps.scheme_dependencies.outcome || 'skipped') }},
                "verifySuite": ${{ toJSON(steps.verify_suite.outcome || 'skipped') }},
                "verifyScheme": ${{ toJSON(steps.verify_scheme.outcome || 'skipped') }},
                "schemeNativeDiagnostic": ${{ toJSON(steps.scheme_native_diagnostic.outcome || 'skipped') }},
                "receiptCheck": ${{ toJSON(steps.receipt_check.outcome || 'skipped') }}
              }
            }
        run: |
          mkdir -p .cache/verification
          printf '%s\n' "$JOB_RECEIPT" > .cache/verification/ci-job.json
      - name: Publish structured verification receipts
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.suite }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .cache/verification/ci-job.json
            .cache/verification/latest-bootstrap-build.json
            .cache/verification/latest-bootstrap-proofs.json
            .cache/verification/latest-${{ inputs.suite }}.json
            .cache/verification/spec/*/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
