[package]
name = "weaver-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = []
# Explicitly selected by the observed server's dev dependency, never by its binary.
commit-observer = ["dep:rustix", "dep:tracing", "dep:tracing-subscriber"]
[dependencies]
weaver-contracts.workspace = true
weaver-policy.workspace = true
mrr-data-backend.workspace = true
futures-executor.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["registry"] }
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["time"], optional = true }
[dev-dependencies]
# Standard Cargo self dev-dependency: tests/benches expose fault-host APIs; production does not.
weaver-ledger = { workspace = true, features = ["commit-observer"] }
ring.workspace = true
hex.workspace = true
cedar-poo-runtime.workspace = true
asp-rust.workspace = true
criterion.workspace = true
tempfile.workspace = true
proptest.workspace = true
[[bench]]
name = "gateway"
harness = false
[lints]
workspace = true

