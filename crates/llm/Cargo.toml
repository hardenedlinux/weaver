[package]
name = "weaver-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Direct OpenAI-compatible and Anthropic model client"

[dependencies]
async-stream = "0.3.6"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "fs", "io-util", "sync", "time"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
sha2.workspace = true
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
uuid = { version = "1", features = ["v4"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
zeroize = "1.9"
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec", "rt"] }
tokio_sse_codec = "0.0.2"

[dev-dependencies]
asp-rust.workspace = true
criterion.workspace = true
proptest.workspace = true
rsa = "0.9.10"
rand = "0.8"
h2 = "0.4"
http = "1"
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true

[[test]]
name = "client"
path = "tests/integration/client.rs"

[[bench]]
name = "gateway"
harness = false

[lints]
workspace = true
