[package]
name = "weaver-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Direct OpenAI-compatible and Anthropic model client"

[dependencies]
async-stream = "0.3.6"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }
tokio_sse_codec = "0.0.2"

[dev-dependencies]
asp-rust.workspace = true
criterion.workspace = true
tokio.workspace = true

[[test]]
name = "client"
path = "tests/integration/client.rs"

[[bench]]
name = "gateway"
harness = false

[lints]
workspace = true
