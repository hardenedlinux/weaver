[package]
name = "weaver-governance"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
scheme-vm = ["dep:gerbil-scheme"]
scheme-qualification = ["scheme-vm"]

[dependencies]
weaver-contracts.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
gerbil-scheme = { workspace = true, optional = true }

[build-dependencies]
weaver-governance-build.workspace = true

[dev-dependencies]
asp-rust.workspace = true
criterion.workspace = true
proptest.workspace = true
weaver-policy-ffi.workspace = true
gerbil-scheme-sys.workspace = true

[[test]]
name = "scheme_vm"
path = "tests/integration/scheme_vm.rs"
required-features = ["scheme-qualification"]

[[bench]]
name = "gateway"
harness = false

# The production library forbids unsafe code. Only the linked integration test
# admits the two documented SDK linker/export bindings.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
