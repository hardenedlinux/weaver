[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/governance",
    "crates/governance-build",
    "crates/policy",
    "crates/policy-ffi",
    "crates/ledger",
    "crates/broker",
    "crates/server",
    "crates/telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later AND Apache-2.0"

[workspace.dependencies]
weaver-contracts = { path = "crates/contracts" }
weaver-governance = { path = "crates/governance" }
weaver-policy = { path = "crates/policy" }
weaver-governance-build = { path = "crates/governance-build" }
weaver-policy-ffi = { path = "crates/policy-ffi" }
weaver-ledger = { path = "crates/ledger" }
weaver-broker = { path = "crates/broker", default-features = false }
weaver-telemetry = { path = "crates/telemetry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
ring = "=0.17.14"
hex = "0.4"
cedar-policy = { version = "=4.14.1", default-features = false }
cedar-poo-runtime = { git = "https://github.com/HardenedLinux/cedar-poo-spec", rev = "76ecbcf9aea42af6785b3c12459adc61fc3fc523", features = ["gateway"] }
mrr-data-backend = { git = "https://github.com/tao3k/mrr-data", rev = "daa6487820f798f0583713de8d03110aeac5d1fd", default-features = false, features = ["turso"] }
futures-executor = "0.3"
bytes = "=1.12.1"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "=0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
proptest = "1.11"
tempfile = "3.27"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.9"
socket2 = "0.6.4"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
subtle = "2.6.1"
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
tokio-stream = { version = "0.1.19", features = ["net"] }
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = "58.4.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
gerbil-scheme-aot-build = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "380f8ba5f87b2f9ba3924302b35b3eea1e3f2a8e" }
gerbil-scheme = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "380f8ba5f87b2f9ba3924302b35b3eea1e3f2a8e" }
gerbil-scheme-sys = { git = "https://github.com/tao3k/gerbil-scheme-rust", rev = "380f8ba5f87b2f9ba3924302b35b3eea1e3f2a8e", features = ["external-program"] }

asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "1ca41124b846dec947f3d05119cafa07eaa57924", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

