apiVersion: v1
kind: ServiceAccount
metadata:
  name: weaver-provider-availability
  namespace: weaver-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weaver-provider-availability
  namespace: weaver-system
rules:
  - apiGroups: [weaver.hardenedlinux.org]
    resources: [provideravailabilities]
    resourceNames: [provider-availability]
    verbs: [get, list, watch]
  - apiGroups: [weaver.hardenedlinux.org]
    resources: [provideravailabilities/status]
    resourceNames: [provider-availability]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weaver-provider-availability
  namespace: weaver-system
subjects:
  - kind: ServiceAccount
    name: weaver-provider-availability
    namespace: weaver-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weaver-provider-availability
