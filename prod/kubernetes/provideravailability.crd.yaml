apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: provideravailabilities.weaver.hardenedlinux.org
spec:
  group: weaver.hardenedlinux.org
  scope: Namespaced
  names:
    plural: provideravailabilities
    singular: provideravailability
    kind: ProviderAvailability
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [available]
              properties:
                available:
                  type: boolean
                  description: Desired availability of the deployment-bound provider fact.
            status:
              type: object
              required: [observedGeneration, sourceEpoch, revision, snapshot]
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 1
                sourceEpoch:
                  type: integer
                  format: int64
                  minimum: 0
                revision:
                  type: integer
                  format: int64
                  minimum: 1
                snapshot:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
